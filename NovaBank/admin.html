<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaBank • Admin</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="topbar"><div class="brand"><div class="logo">N</div><div><b>NovaBank</b><span>Admin Console</span></div></div>
<div class="top-actions"><span>Quản trị viên</span><button class="ghost" onclick="logout()">Đăng xuất</button></div></header>
<main class="container">
<section class="welcome"><div><p class="muted">Administration</p><h1>Quản lý tài khoản</h1></div><button class="primary" onclick="openCreate()">+ Tạo tài khoản</button></section>
<div class="grid-3">
<div class="card stat"><span>Tổng tài khoản</span><strong id="totalUsers">0</strong></div>
<div class="card stat"><span>Tổng số dư</span><strong id="totalBalance">0 ₫</strong></div>
<div class="card stat"><span>Tổng giao dịch</span><strong id="totalTx">0</strong></div>
</div>
<section class="card"><div class="section-head"><h2>Danh sách tài khoản</h2><input id="search" class="search" placeholder="Tìm tên hoặc số tài khoản..." oninput="render()"></div>
<div class="table-wrap"><table><thead><tr><th>Tài khoản</th><th>Chủ tài khoản</th><th>Số dư</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="users"></tbody></table></div></section>
</main>
<div id="modal" class="modal hidden"><div class="modal-box"><div class="section-head"><h2 id="modalTitle">Tài khoản</h2><button class="icon-btn" onclick="closeModal()">×</button></div>
<form id="userForm"><input type="hidden" id="editId">
<label>Họ tên</label><input id="name" required><label>Số tài khoản</label><input id="newAccount" required><label>Mật khẩu</label><input id="newPassword" required><label>Email</label><input id="newEmail"><label>Số điện thoại</label><input id="newPhone"><label>Số dư ban đầu</label><input id="newBalance" type="number" min="0" value="0">
<div class="modal-actions"><button type="button" class="ghost" onclick="closeModal()">Hủy</button><button class="primary">Lưu</button></div></form><div id="adminMsg" class="msg"></div></div></div>
<script src="js/database.js"></script><script src="js/admin.js"></script></body></html>
