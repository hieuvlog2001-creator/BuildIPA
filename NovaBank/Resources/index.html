<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaBank • Đăng nhập</title><link rel="stylesheet" href="css/style.css"></head>
<body class="login-bg">
<div class="login-card">
  <div class="brand"><div class="logo">N</div><div><b>NovaBank</b><span>Digital Banking</span></div></div>
  <h1>Chào mừng trở lại</h1><p class="muted">Đăng nhập tài khoản Banking Demo</p>
  <form id="loginForm">
    <label>Số tài khoản</label><input id="account" required placeholder="VD: 10000001" autocomplete="username">
    <label>Mật khẩu</label><input id="password" type="password" required placeholder="••••••••" autocomplete="current-password">
    <button class="primary full">Đăng nhập</button>
  </form>
  <div id="loginMsg" class="msg"></div>
  <div class="demo-box"><b>Tài khoản demo</b><br>Khách: <code>10000001</code> / <code>123456</code><br>Admin: <code>admin</code> / <code>admin123</code></div>
</div>
<script src="js/database.js"></script><script src="js/auth.js"></script></body></html>
