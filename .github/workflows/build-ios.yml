name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Find Flutter project
        shell: bash
        run: |
          PROJECT_DIR="$(dirname "$(find . -name pubspec.yaml -not -path './.git/*' | head -n 1)")"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Generate iOS project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter create \
            --platforms=ios \
            --org com.mb.recreated \
            .

      - name: Verify iOS project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Checking iOS project..."
          ls -la ios
          test -f ios/Runner.xcodeproj/project.pbxproj
          echo "iOS Xcode project OK"

      - name: Build IPA
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build ipa --release --no-codesign

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ env.PROJECT_DIR }}/build/ios/ipa/*.ipa
          if-no-files-found: error
