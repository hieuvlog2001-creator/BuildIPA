name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Find Flutter project
        shell: bash
        run: |
          PROJECT_DIR="$(dirname "$(find . -name pubspec.yaml -not -path './.git/*' | head -n 1)")"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Generate iOS project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter create \
            --platforms=ios \
            --org com.mb.recreated \
            .

      - name: Build iOS app
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build ios --release --no-codesign

      - name: Create unsigned IPA
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          rm -rf unsigned_ipa
          mkdir -p unsigned_ipa/Payload

          cp -R build/ios/iphoneos/Runner.app unsigned_ipa/Payload/

          cd unsigned_ipa
          zip -r ../MB_Recreated_App.ipa Payload

          cd ..
          ls -lh MB_Recreated_App.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ env.PROJECT_DIR }}/MB_Recreated_App.ipa
          if-no-files-found: error
